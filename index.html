<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACE — Anime Vehicle Toy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  overflow:hidden;
  background:white;
  color:#111;
}

.screen{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* HOME */
#home{
  flex-direction:column;
  background:white;
}

.tag{
  font-size:12px;
  letter-spacing:6px;
  margin-bottom:25px;
}

h1{
  font-size:clamp(80px,18vw,200px);
  letter-spacing:12px;
  animation:float 3s infinite ease-in-out;
}

@keyframes float{
  50%{transform:translateY(-8px)}
}

button{
  cursor:pointer;
  background:white;
  border:1px solid #111;
  padding:13px 35px;
  letter-spacing:3px;
}

#start{
  margin-top:55px;
}

button:hover{
  background:#111;
  color:white;
}


/* SELECT */
#select{
  display:none;
  flex-direction:column;
  background:#f5f5f5;
}

.heading{
  letter-spacing:5px;
  font-size:13px;
  margin-bottom:35px;
}

.cards{
  display:flex;
  gap:25px;
  width:min(750px,90%);
}

.card{
  flex:1;
  height:280px;
  background:white;
  border:1px solid #ccc;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  align-items:center;
  cursor:pointer;
  transition:.3s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 15px 35px #0002;
}

.card h2{
  font-size:25px;
  letter-spacing:3px;
}

.card p{
  font-size:11px;
  letter-spacing:3px;
}


/* VEHICLES */
.bike,.car{
  position:relative;
  width:150px;
  height:65px;
}

.bike-body{
  position:absolute;
  width:100px;
  height:27px;
  background:#a71925;
  border-radius:25px 40px 8px 8px;
  left:25px;
  top:20px;
}

.wheel{
  position:absolute;
  width:28px;
  height:28px;
  background:#111;
  border:5px solid #777;
  border-radius:50%;
  bottom:0;
}

.wheel.a{left:18px}
.wheel.b{right:5px}

.car-body{
  position:absolute;
  width:140px;
  height:30px;
  background:#54278d;
  border-radius:40px 15px 8px 8px;
  left:5px;
  bottom:10px;
}

.cabin{
  position:absolute;
  width:65px;
  height:27px;
  background:#30175a;
  transform:skew(-25deg);
  left:48px;
  top:8px;
}

.car .wheel.a{left:20px}
.car .wheel.b{right:20px}


/* RACE */
#race{
  display:none;
  position:relative;
  background:white;
  transition:background 3s;
}

.info{
  position:absolute;
  top:25px;
  left:25px;
  right:25px;
  display:flex;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:3px;
}

.progress{
  position:absolute;
  top:60px;
  left:25px;
  width:180px;
  height:4px;
  background:#ddd;
}

#bar{
  height:100%;
  width:0%;
  background:#111;
}

.track{
  position:absolute;
  top:50%;
  width:100%;
  height:170px;
  transform:translateY(-50%);
  border-top:1px solid #aaa;
  border-bottom:1px solid #aaa;
  overflow:hidden;
}

.lines{
  position:absolute;
  top:50%;
  width:200%;
  height:4px;
  background:repeating-linear-gradient(
    90deg,
    transparent 0 35px,
    #999 35px 75px
  );
  animation:road .5s linear infinite;
}

@keyframes road{
  to{transform:translateX(-110px)}
}

.finish-line{
  position:absolute;
  right:8%;
  height:100%;
  width:12px;
  background:repeating-linear-gradient(
    0deg,#111 0 15px,white 15px 30px
  );
}

#player{
  position:absolute;
  left:10%;
  top:50%;
  transform:translate(-50%,-50%);
  transition:left .08s,top .08s;
  z-index:5;
}

.controls{
  position:absolute;
  bottom:25px;
  display:flex;
  gap:7px;
}

.controls button{
  width:48px;
  height:48px;
  padding:0;
}


/* FINISH */
#finish{
  display:none;
  flex-direction:column;
  text-align:center;
  transition:background 1s;
  color:white;
}

.complete{
  font-size:11px;
  letter-spacing:5px;
  margin-bottom:30px;
}

#finalAnime{
  font-size:clamp(50px,10vw,100px);
  font-weight:bold;
  letter-spacing:8px;
}

#finalYear{
  margin-top:15px;
  letter-spacing:5px;
}

#finalVehicle{
  margin-top:12px;
  font-size:12px;
  letter-spacing:4px;
}

#again{
  margin-top:45px;
  background:transparent;
  color:white;
  border-color:white;
}

#again:hover{
  background:white;
  color:#111;
}

#secret{
  position:absolute;
  bottom:90px;
  opacity:0;
  letter-spacing:3px;
  font-size:10px;
}

.show{
  animation:show .8s;
}

@keyframes show{
  50%{opacity:1}
}


/* MOBILE */
@media(max-width:600px){
  .cards{flex-direction:column}
  .card{height:210px}
  .heading{margin-bottom:20px}
}
</style>
</head>

<body>

<!-- HOME -->
<section id="home" class="screen">
  <div class="tag">ANIME VEHICLE TOY</div>
  <h1>RACE</h1>
  <button id="start" onclick="showSelect()">START</button>
</section>


<!-- VEHICLE SELECTION -->
<section id="select" class="screen">

  <div class="heading">CHOOSE YOUR RIDE</div>

  <div class="cards">

    <div class="card" onclick="choose('akira')">
      <p>AKIRA</p>

      <div class="bike">
        <div class="bike-body"></div>
        <div class="wheel a"></div>
        <div class="wheel b"></div>
      </div>

      <h2>KANEDA'S BIKE</h2>
      <p>SELECT</p>
    </div>


    <div class="card" onclick="choose('redline')">
      <p>REDLINE</p>

      <div class="car">
        <div class="cabin"></div>
        <div class="car-body"></div>
        <div class="wheel a"></div>
        <div class="wheel b"></div>
      </div>

      <h2>TRANS AM 20000</h2>
      <p>SELECT</p>
    </div>

  </div>
</section>


<!-- RACE -->
<section id="race" class="screen">

  <div class="info">
    <span>RACE / <b id="raceName">AKIRA</b></span>
    <span>SPEED <b id="speed">0</b></span>
  </div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div class="track">
    <div class="lines"></div>
    <div class="finish-line"></div>
    <div id="player"></div>
  </div>

  <div id="secret">BOOST!</div>

  <div class="controls">
    <button onclick="left()">◀</button>
    <button onclick="boost()">⚡</button>
    <button onclick="right()">▶</button>
  </div>

</section>


<!-- FINISH -->
<section id="finish" class="screen">

  <div class="complete">RACE COMPLETE</div>

  <div id="finalAnime">AKIRA</div>

  <div id="finalYear">1988</div>

  <div id="finalVehicle">KANEDA'S BIKE</div>

  <button id="again" onclick="again()">RACE AGAIN</button>

</section>


<script>

/* GAME DATA */

const data = {
  akira:{
    name:"AKIRA",
    year:"1988",
    vehicle:"KANEDA'S BIKE",
    color:"#941923"
  },

  redline:{
    name:"REDLINE",
    year:"2009",
    vehicle:"TRANS AM 20000",
    color:"#54278d"
  }
};


/* VARIABLES */

let chosen="";
let x=10;
let y=50;
let speed=0;
let playing=false;


/* START */

function showSelect(){
  home.style.display="none";
  select.style.display="flex";
}


/* CHOOSE */

function choose(type){

  chosen=type;
  x=10;
  y=50;
  speed=0;
  playing=true;

  select.style.display="none";
  race.style.display="block";

  player.innerHTML="";

  if(type==="akira"){
    player.innerHTML=`
      <div class="bike">
        <div class="bike-body"></div>
        <div class="wheel a"></div>
        <div class="wheel b"></div>
      </div>`;
  }
  else{
    player.innerHTML=`
      <div class="car">
        <div class="cabin"></div>
        <div class="car-body"></div>
        <div class="wheel a"></div>
        <div class="wheel b"></div>
      </div>`;
  }

  raceName.innerText=data[type].name;

  update();
}


/* MOVE RIGHT */

function right(){

  if(!playing)return;

  x+=6;
  speed+=2;

  if(x>=88){
    finishRace();
    return;
  }

  update();
}


/* MOVE LEFT */

function left(){

  if(!playing)return;

  x-=3;

  if(x<5)x=5;

  speed=Math.max(0,speed-1);

  update();
}


/* BOOST — BONUS / EASTER EGG */

function boost(){

  if(!playing)return;

  x+=12;
  speed+=10;

  secret.classList.add("show");

  setTimeout(()=>{
    secret.classList.remove("show");
  },700);

  if(x>=88){
    finishRace();
    return;
  }

  update();
}


/* KEYBOARD */

document.addEventListener("keydown",e=>{

  if(!playing)return;

  if(e.key==="ArrowRight"){
    e.preventDefault();
    right();
  }

  if(e.key==="ArrowLeft"){
    e.preventDefault();
    left();
  }

  if(e.code==="Space"){
    e.preventDefault();
    boost();
  }
});


/* UPDATE */

function update(){

  player.style.left=x+"%";
  player.style.top=y+"%";

  speedText();

  let progress=Math.max(0,Math.min(100,(x-10)/78*100));

  bar.style.width=progress+"%";

  changeTheme(progress);
}


/* SPEED */

function speedText(){
  speedElement=document.getElementById("speed");
  speedElement.innerText=speed;
}


/* COLOUR TRANSFORMATION */

function changeTheme(progress){

  let amount=progress/100;

  let r,g,b;

  if(chosen==="akira"){

    r=Math.round(255-(255-148)*amount);
    g=Math.round(255-(255-25)*amount);
    b=Math.round(255-(255-35)*amount);

  }else{

    r=Math.round(255-(255-84)*amount);
    g=Math.round(255-(255-39)*amount);
    b=Math.round(255-(255-141)*amount);

  }

  race.style.background=`rgb(${r},${g},${b})`;
}


/* FINISH */

function finishRace(){

  playing=false;

  let d=data[chosen];

  race.style.display="none";

  finish.style.display="flex";

  finish.style.background=d.color;

  finalAnime.innerText=d.name;
  finalYear.innerText=d.year;
  finalVehicle.innerText=d.vehicle;

  /* BONUS: SAVE LAST CHOICE */
  localStorage.setItem("lastRace",chosen);
}


/* RACE AGAIN */

function again(){

  finish.style.display="none";
  select.style.display="flex";

  race.style.background="white";

  speed=0;
  x=10;
}

</script>

</body>
</html>
🎮 Controls
